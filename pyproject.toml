[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zulf-analysis-tools"
version = "0.1.0"
description = "Reproducible local ZULF analysis tools for Codex"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "mcp>=1.12,<2"]

[project.scripts]
zulf-tools = "zulf_tools.cli:main"
zulf-tools-mcp = "zulf_tools.server:main"

[tool.setuptools.packages.find]
include = ["zulf_tools*"]

